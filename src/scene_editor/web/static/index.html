<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synthetic Scene Editor</title>
<script>
/* Apply a saved theme before first paint; without one the OS setting decides. */
try { const saved = localStorage.getItem('scene-editor-theme'); if (saved) document.documentElement.dataset.theme = saved; } catch (error) {}
</script>
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/editor.css">
<link rel="stylesheet" href="/autogen.css">
<link rel="stylesheet" href="/tape.css">
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<header class="topbar">
  <div class="brand"><span class="brand-mark" aria-hidden="true"></span><h1>Synthetic Scene Editor</h1></div>
  <button id="theme" type="button" class="quiet" aria-label="Switch between light and dark theme">Theme</button>
</header>
<div class="toolbar" aria-label="Synthetic data controls">
  <span class="toolbar-note">Соберите сцену вручную ниже, создайте новые объекты или сгенерируйте партию сцен по правилам.</span>
  <span class="toolbar-spacer"></span>
  <button id="morph-open">Генератор объектов</button>
  <button id="tape-open">Лента (запись)</button>
  <button id="autogen-open" class="primary">Автогенератор</button>
</div>
<main id="content" tabindex="-1"><p>Loading…</p></main>
<dialog id="autogen-dialog" class="autogen-dialog" aria-labelledby="autogen-title"></dialog>
<dialog id="tape-dialog" class="autogen-dialog" aria-labelledby="tape-title"></dialog>
<dialog id="morph-dialog" class="autogen-dialog" aria-labelledby="morph-title"></dialog>
<script src="/app.js" defer></script>
<script src="/editor.js" defer></script>
<script src="/autogen.js" defer></script>
<script src="/morphgen.js" defer></script>
<script src="/tape.js" defer></script>
</body>
</html>
